<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kelompok Tani Makmur Jaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          serif: ['Fraunces', 'serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        },
        colors: {
          brand: {
            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22'
          },
          accent: {
            500: '#f59e0b', 600: '#d97706',
          },
          surface: '#F4F7F6'
        }
      }
    }
  }
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script>
  Babel.registerPreset('react-classic', {
    presets: [ [Babel.availablePresets['react'], { "runtime": "classic" }] ]
  });
</script>

<style>
  body { margin: 0; background-color: #F4F7F6; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  ::selection { background: #059669; color: white; }
  .ledger-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 600px; }
  .ledger-row td { border-bottom: 1px solid #E2E8F0; padding: 14px 16px; font-size: 14px; color: #1E293B; transition: background 0.2s; }
  .ledger-row:hover td { background: #F8FAFC; }
  .ledger-head th { text-align: left; padding: 14px 16px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: #475569; border-bottom: 2px solid #CBD5E1; font-family: 'IBM Plex Mono', monospace; font-weight: 700; background: #F1F5F9;}
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/**
 * ============================================================
 * API URL KINI DISIMPAN DI SINI
 * ============================================================
 */
const API_URL = "https://script.google.com/macros/s/AKfycbz_G2Xl1sllRyp9AqjszXFOskt7l-XnnJ1XasTkqA3ZwgPt0-ZaIxzzqodYhnbdWtce/exec";

// ---------- DEMO DATA ----------
const demoAnggota = [
  { ID: "A1", Nama: "Suparjo", NIK: "3301xxxxxxxx01", NoHP: "0812xxxx01", LuasLahan_Ha: 0.8, Komoditas: "Padi", Status: "Aktif", TanggalGabung: "2022-01-10" },
  { ID: "A2", Nama: "Warsini", NIK: "3301xxxxxxxx02", NoHP: "0812xxxx02", LuasLahan_Ha: 1.2, Komoditas: "Padi", Status: "Aktif", TanggalGabung: "2022-01-10" },
];
const BULAN_ID = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

function formatTanggal(d) {
  if (!d) return "-"; const date = new Date(d); if (isNaN(date)) return String(d);
  return `${date.getDate()} ${BULAN_ID[date.getMonth()]} ${date.getFullYear()}`;
}
function formatRupiah(n) { return "Rp " + Number(n || 0).toLocaleString("id-ID"); }
function bulanLabel(b) {
  if (!b) return "-"; const [y, m] = String(b).split("-");
  return `${BULAN_ID[parseInt(m, 10) - 1]} ${y}`;
}

function Badge({ children, tone = "neutral" }) {
  const tones = {
    neutral: "bg-slate-100 text-slate-700 border-slate-200", good: "bg-brand-50 text-brand-800 border-brand-200",
    warn: "bg-accent-50 text-accent-800 border-accent-200", bad: "bg-rose-50 text-rose-800 border-rose-200",
  };
  return <span className={`px-2.5 py-1 rounded-md text-[11px] font-bold border ${tones[tone]} font-mono tracking-tight`}>{children}</span>;
}

function SectionHeader({ eyebrow, title, desc, action }) {
  return (
    <div className="mb-8 md:mb-10 flex flex-col md:flex-row md:items-end justify-between gap-5">
      <div>
        <div className="text-[11px] tracking-widest uppercase mb-2 text-brand-600 font-mono font-bold">{eyebrow}</div>
        <h2 className="text-3xl md:text-4xl font-serif font-black text-slate-900 tracking-tight">{title}</h2>
        {desc && <p className="text-sm text-slate-500 max-w-2xl mt-2.5 font-medium leading-relaxed">{desc}</p>}
      </div>
      {action && <div>{action}</div>}
    </div>
  );
}

// ================= APP ROOT =================
function App() {
  const [tab, setTab] = useState("dashboard");
  const [token, setToken] = useState(null);
  const [loginOpen, setLoginOpen] = useState(false);
  const [loginForm, setLoginForm] = useState({ username: "", password: "" });
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  const [anggota, setAnggota] = useState(demoAnggota);
  const [pupukRiwayat, setPupukRiwayat] = useState([]);
  const [arisan, setArisan] = useState([]);
  const [iuran, setIuran] = useState([]);
  const [logoB64, setLogoB64] = useState(null);

  const isAdmin = !!token;

  function showToast(msg, tone = "good") {
    setToast({ msg, tone });
    setTimeout(() => setToast(null), 3500);
  }

  async function apiCall(action, data = {}, method = "GET") {
    setLoading(true);
    try {
      const res = await fetch(method === "GET" ? `${API_URL}?action=${action}` : API_URL, {
        method, body: method === "POST" ? JSON.stringify({ action, token, ...data }) : undefined,
      });
      return await res.json();
    } catch (err) {
      showToast("Gagal terhubung ke server", "bad"); return null;
    } finally { setLoading(false); }
  }

  const loadAllData = async () => {
    const [a, p, ar, ir, lg] = await Promise.all([
      apiCall("getAnggota"), apiCall("getPupukStatus"), apiCall("getArisan"), apiCall("getIuran"), apiCall("getLogo")
    ]);
    if (a?.success) setAnggota(a.data);
    if (p?.success) setPupukRiwayat(p.riwayat);
    if (ar?.success) setArisan(ar.data);
    if (ir?.success) setIuran(ir.data);
    if (lg?.success && lg.base64) setLogoB64(lg.base64);
  };

  useEffect(() => { loadAllData(); }, []);

  async function handleLogin() {
    const res = await apiCall("login", { username: loginForm.username, password: loginForm.password }, "POST");
    if (res?.success) {
      setToken(res.token); setLoginOpen(false); showToast("Sesi Admin Terbuka");
    } else showToast(res?.message || "Kredensial tidak valid", "bad");
  }

  const navItems = [
    { key: "dashboard", label: "Ringkasan Eksekutif", icon: "M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" },
    { key: "anggota", label: "Database Anggota", icon: "M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" },
    { key: "pupuk", label: "Distribusi Pupuk", icon: "M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" },
    { key: "keuangan", label: "Arisan & Iuran", icon: "M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" }
  ];
  if (isAdmin) {
    navItems.push({ key: "pengaturan", label: "Pengaturan & Laporan", icon: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z" });
  }

  const antreanPupuk = useMemo(() => {
    const aktif = anggota.filter((a) => a.Status === "Aktif");
    const list = aktif.map((a) => {
      const riwayatSaya = pupukRiwayat.filter((r) => r.AnggotaID === a.ID && r.Status === "Dapat");
      let terakhir = null;
      riwayatSaya.forEach((r) => { const t = new Date(r.Tanggal); if (!terakhir || t > terakhir) terakhir = t; });
      return { id: a.ID, nama: a.Nama, terakhir, totalDapat: riwayatSaya.length };
    });
    list.sort((x, y) => {
      if (!x.terakhir && !y.terakhir) return x.totalDapat - y.totalDapat;
      if (!x.terakhir) return -1; if (!y.terakhir) return 1;
      return x.terakhir - y.terakhir;
    });
    return list;
  }, [anggota, pupukRiwayat]);

  const stats = useMemo(() => {
    return {
      totalAnggota: anggota.filter((a) => a.Status === "Aktif").length,
      totalIuran: iuran.filter((i) => i.StatusBayar === "Lunas").reduce((s, i) => s + Number(i.Nominal || 0), 0),
      totalArisan: arisan.filter((a) => a.StatusBayar === "Lunas").reduce((s, a) => s + Number(a.Nominal || 0), 0),
      totalPupuk: pupukRiwayat.filter((p) => p.Status === "Dapat").reduce((s, p) => s + Number(p.Jumlah_Kg || 0), 0)
    };
  }, [anggota, iuran, arisan, pupukRiwayat]);

  return (
    <div className="font-sans bg-surface min-h-screen text-slate-800 flex flex-col md:flex-row relative">
      {toast && (
        <div className={`fixed top-6 right-6 z-[60] px-6 py-4 rounded-xl shadow-2xl text-sm font-bold transition-all flex items-center gap-3 border ${toast.tone === "bad" ? "bg-rose-600 text-white border-rose-500" : "bg-brand-950 text-white border-brand-800"}`}>
          {toast.msg}
        </div>
      )}

      {/* SIDEBAR (Desktop) */}
      <aside className="w-full md:w-[310px] shrink-0 bg-brand-950 border-r border-brand-900 flex-col z-20 sticky top-0 h-screen hidden md:flex shadow-xl shadow-brand-900/20">
        <div className="p-6 lg:p-7 border-b border-brand-800/50 flex items-center gap-5 bg-gradient-to-br from-brand-950 to-brand-900">
          <div className="w-16 h-16 lg:w-20 lg:h-20 rounded-full overflow-hidden border-[3px] border-brand-400/80 shadow-[0_0_20px_rgba(52,211,153,0.4)] shrink-0 bg-brand-900 relative flex items-center justify-center">
             {logoB64 ? (
               <img src={logoB64} alt="Logo KTMJ" className="absolute inset-0 w-full h-full object-cover scale-[1.25] origin-center" />
             ) : (
               <span className="font-serif font-black text-brand-300 text-2xl">KT</span>
             )}
          </div>
          <div className="flex flex-col justify-center pt-1">
            <div className="text-[11px] lg:text-xs tracking-[0.25em] uppercase text-brand-400 font-sans font-black mb-1 drop-shadow-sm">Kelompok Tani</div>
            <div className="font-serif font-black text-2xl lg:text-3xl text-white leading-none tracking-tight">
              Makmur <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 via-emerald-200 to-yellow-100">Jaya.</span>
            </div>
          </div>
        </div>

        <nav className="flex flex-col gap-2 p-5 w-full flex-1 mt-2">
          {navItems.map((item) => (
            <button key={item.key} onClick={() => setTab(item.key)} className={`flex items-center gap-4 px-5 py-4 rounded-2xl text-sm font-bold transition-all whitespace-nowrap w-full text-left ${tab === item.key ? "bg-brand-600 text-white shadow-lg shadow-brand-900/50 border border-brand-500/50" : "text-brand-300 hover:bg-brand-800/50 hover:text-white border border-transparent"}`}>
              <svg className="w-5 h-5 opacity-90" fill="currentColor" viewBox="0 0 20 20"><path d={item.icon} fillRule="evenodd" clipRule="evenodd"></path></svg>
              {item.label}
            </button>
          ))}
        </nav>

        <div className="p-5 pb-10 mt-auto border-t border-brand-800/50 bg-brand-900/20">
          {isAdmin ? (
            <div className="bg-brand-800/60 px-5 py-4 rounded-2xl border border-brand-700/50 backdrop-blur-sm shadow-inner">
              <span className="flex items-center gap-2 text-xs font-bold text-white mb-4"><div className="w-2.5 h-2.5 rounded-full bg-brand-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div> Admin Akses Penuh</span>
              <button onClick={() => setToken(null)} className="w-full text-xs font-bold text-rose-300 bg-rose-950/60 hover:bg-rose-900 border border-rose-800/50 py-3 rounded-xl transition-all shadow-sm">Logout Sistem</button>
            </div>
          ) : (
            <button onClick={() => setLoginOpen(true)} className="w-full px-5 py-4 rounded-2xl text-sm font-black bg-white text-brand-950 hover:bg-brand-50 transition-all shadow-[0_4px_15px_rgba(255,255,255,0.1)] border-b-4 border-slate-200 active:border-b-0 active:translate-y-1">
              LOGIN ADMINISTRATOR
            </button>
          )}
        </div>
      </aside>

      {/* MOBILE HEADER & HAMBURGER */}
      <div className="md:hidden flex items-center justify-between px-5 py-3 bg-gradient-to-r from-brand-950 to-brand-900 text-white border-b border-brand-800 z-40 sticky top-0 shadow-xl">
         <div className="flex items-center gap-4">
            <div className="w-14 h-14 rounded-full overflow-hidden border-2 border-brand-400/80 shadow-[0_0_12px_rgba(52,211,153,0.4)] shrink-0 bg-brand-900 relative flex items-center justify-center">
               {logoB64 ? (
                 <img src={logoB64} alt="Logo KTMJ" className="absolute inset-0 w-full h-full object-cover scale-[1.25] origin-center" />
               ) : (
                 <span className="font-serif font-black text-brand-300 text-xl">KT</span>
               )}
            </div>
            <div className="flex flex-col justify-center">
               <div className="text-[10px] tracking-[0.2em] uppercase text-brand-400 font-sans font-black leading-none mb-1 drop-shadow-sm">Kelompok Tani</div>
               <div className="font-serif font-black text-[22px] text-white leading-none tracking-tight">
                 Makmur <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 via-emerald-200 to-yellow-100">Jaya.</span>
               </div>
            </div>
         </div>
         <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 -mr-2 focus:outline-none text-brand-100 hover:text-white transition-colors bg-brand-800/30 rounded-lg border border-brand-700/50">
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
               {mobileMenuOpen ? (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" />
               ) : (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16" />
               )}
            </svg>
         </button>
      </div>

      {/* MOBILE DROPDOWN MENU */}
      {mobileMenuOpen && (
        <div className="md:hidden fixed inset-0 z-30 bg-brand-950/80 backdrop-blur-md pt-[80px]" onClick={() => setMobileMenuOpen(false)}>
          <div className="bg-brand-900 shadow-2xl rounded-b-[2rem] border-t border-brand-800 p-5 flex flex-col gap-2 animate-slideDown overflow-hidden" onClick={(e) => e.stopPropagation()}>
             {navItems.map((item) => (
              <button key={item.key} onClick={() => {setTab(item.key); setMobileMenuOpen(false);}} className={`flex items-center gap-4 px-5 py-4 rounded-2xl text-sm font-bold transition-all w-full text-left border ${tab === item.key ? "bg-brand-600 text-white border-brand-500 shadow-md" : "text-brand-200 border-transparent hover:bg-brand-800"}`}>
                <svg className="w-5 h-5 opacity-90" fill="currentColor" viewBox="0 0 20 20"><path d={item.icon} fillRule="evenodd" clipRule="evenodd"></path></svg>
                {item.label}
              </button>
            ))}
            <div className="mt-5 pt-5 border-t border-brand-800/50 px-1">
              {isAdmin ? (
                 <button onClick={() => {setToken(null); setMobileMenuOpen(false);}} className="w-full text-sm font-bold text-rose-300 bg-rose-950/50 border border-rose-900 py-4 rounded-xl shadow-inner">Logout Sistem</button>
              ) : (
                 <button onClick={() => {setLoginOpen(true); setMobileMenuOpen(false);}} className="w-full text-sm font-black text-brand-950 bg-white shadow-[0_4px_15px_rgba(255,255,255,0.15)] py-4 rounded-xl">LOGIN ADMINISTRATOR</button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* MAIN CONTENT */}
      <main className="flex-1 p-5 md:p-8 lg:p-12 max-w-6xl overflow-x-hidden pb-28 md:pb-24">
        {loading && <div className="fixed inset-0 bg-white/40 backdrop-blur-[2px] z-[55] flex items-center justify-center"><div className="w-12 h-12 border-4 border-brand-600 border-t-transparent rounded-full animate-spin shadow-xl"></div></div>}

        {tab === "dashboard" && <Dashboard stats={stats} antreanPupuk={antreanPupuk} arisan={arisan} />}
        {tab === "anggota" && (
          <AnggotaTab anggota={anggota} isAdmin={isAdmin} apiCall={apiCall} onRefresh={async () => { const a = await apiCall("getAnggota"); if (a?.success) setAnggota(a.data); }} showToast={showToast} />
        )}
        {tab === "pupuk" && (
          <PupukTab antreanPupuk={antreanPupuk} riwayat={pupukRiwayat} isAdmin={isAdmin}
            onDistribusi={async (payload) => {
              const res = await apiCall("distribusiPupuk", payload, "POST");
              if (res?.success) { showToast("Distribusi berhasil dicatat"); const p = await apiCall("getPupukStatus"); if (p?.success) setPupukRiwayat(p.riwayat); }
            }}
          />
        )}
        {tab === "keuangan" && (
          <KeuanganTab arisan={arisan} iuran={iuran} anggota={anggota} isAdmin={isAdmin} 
            onCatat={async (payload) => {
              let successCount = 0; let errorMsg = "";
              if (payload.bayarIuran) {
                const res = await apiCall("catatIuran", { bulan: payload.bulan, anggotaId: payload.anggotaId, statusBayar: "Lunas", nominal: payload.nominalIuran }, "POST");
                if (res?.success) successCount++; else errorMsg += "Gagal catat iuran. ";
              }
              if (payload.bayarArisan || payload.pemenangArisan) {
                const res = await apiCall("catatArisan", { bulan: payload.bulan, anggotaId: payload.anggotaId, statusBayar: payload.bayarArisan ? "Lunas" : "Belum", nominal: payload.nominalArisan, pemenang: payload.pemenangArisan ? "Y" : "N" }, "POST");
                if (res?.success) successCount++; else errorMsg += "Gagal catat arisan. ";
              }
              if (successCount > 0) {
                showToast("Data Keuangan Diperbarui!");
                const [ar, ir] = await Promise.all([apiCall("getArisan"), apiCall("getIuran")]);
                if (ar?.success) setArisan(ar.data); if (ir?.success) setIuran(ir.data);
              } else if (errorMsg) showToast(errorMsg, "bad");
            }} 
          />
        )}
        {tab === "pengaturan" && isAdmin && (
          <PengaturanTab logoB64={logoB64} setLogoB64={setLogoB64} apiCall={apiCall} showToast={showToast} 
            anggota={anggota} pupukRiwayat={pupukRiwayat} arisan={arisan} iuran={iuran} 
          />
        )}
      </main>

      {/* FLOATING FOOTER */}
      <footer className="fixed bottom-0 left-0 right-0 z-40 bg-brand-950/95 backdrop-blur-md shadow-[0_-4px_15px_rgba(0,0,0,0.15)] text-brand-100 text-[10px] md:text-[11px] py-1.5 text-center font-mono tracking-widest border-t border-brand-800">
         KELOMPOK TANI MAKMUR JAYA <span className="opacity-30 mx-1.5 md:mx-4">||</span> SAMBIREJO <span className="opacity-30 mx-1.5 md:mx-4">||</span> 2026 <span className="opacity-30 mx-1.5 md:mx-4">||</span> Okman Script
      </footer>

      {/* LOGIN MODAL */}
      {loginOpen && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-brand-950/60 backdrop-blur-sm">
          <div className="w-full max-w-sm rounded-[2rem] p-8 bg-white shadow-2xl border border-slate-100 animate-slideDown">
            <h3 className="text-3xl mb-2 font-serif font-black text-slate-900 tracking-tight">Otorisasi</h3>
            <p className="text-sm mb-8 text-slate-500 font-medium">Sistem terenkripsi khusus pengurus.</p>
            
            <label className="block text-xs font-bold mb-2 text-slate-700 tracking-wide uppercase">ID Pengguna</label>
            <input className="w-full mb-5 px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all font-semibold"
              value={loginForm.username} onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })} />

// ================= PENGATURAN & LAPORAN =================
function PengaturanTab({ logoB64, setLogoB64, apiCall, showToast, anggota, pupukRiwayat, arisan, iuran }) {
  const fileInputRef = useRef(null);
  
  // State untuk form Cetak Laporan
  const [bulanLaporan, setBulanLaporan] = useState(() => new Date().toISOString().slice(0, 7)); // Format YYYY-MM

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    // Kompresi Gambar
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 250; 
        let width = img.width;
        let height = img.height;
        
        if (width > height) {
          if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
        } else {
          if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
        }
        
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        
        const res = await apiCall("saveLogo", { base64: dataUrl }, "POST");
        if (res?.success) {
          setLogoB64(dataUrl);
          showToast("Logo berhasil diperbarui!");
        } else {
          showToast("Gagal mengunggah logo", "bad");
        }
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleCetakPDF = (jenis) => {
    try {
      const { jsPDF } = window.jspdf;
      
      // Ukuran Kertas F4 Versi Indonesia (Lebar: 215 mm / 21.5 cm, Tinggi: 330 mm / 33 cm)
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: [215, 330] });

      const drawHeader = (title) => {
        if (logoB64) {
          doc.addImage(logoB64, 'JPEG', 14, 10, 20, 20); 
        }
        doc.setFontSize(16);
        doc.setFont("helvetica", "bold");
        doc.text("KELOMPOK TANI MAKMUR JAYA", 40, 16);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("Sistem Informasi Resmi Kelompok Tani", 40, 22);
        
        // Garis Pembatas
        doc.setLineWidth(0.5);
        doc.line(14, 33, 201, 33);
        
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text(title, 14, 43);
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        if(jenis !== 'anggota'){
            doc.text(`Periode: ${bulanLabel(bulanLaporan)}`, 14, 49);
        }
      };

      let head = [];
      let body = [];
      let startY = 55;

      if (jenis === 'anggota') {
        drawHeader("LAPORAN DATA ANGGOTA LENGKAP");
        head = [['No', 'ID', 'Nama', 'NIK', 'No HP', 'Luas (Ha)', 'Komoditas', 'Status']];
        body = anggota.map((a, i) => [i + 1, a.ID, a.Nama, a.NIK, a.NoHP || '-', a.LuasLahan_Ha, a.Komoditas || '-', a.Status]);
        doc.autoTable({ startY, head, body, theme: 'grid', styles: { fontSize: 9 } });
      } 
      else if (jenis === 'pupuk') {
        drawHeader("LAPORAN DATA DISTRIBUSI PUPUK");
        const filtered = pupukRiwayat.filter(p => p.Tanggal && p.Tanggal.startsWith(bulanLaporan));
        head = [['No', 'Tanggal', 'Nama Anggota', 'Jumlah (Kg)', 'Status', 'Keterangan']];
        body = filtered.map((p, i) => [i + 1, formatTanggal(p.Tanggal), p.NamaAnggota, p.Jumlah_Kg, p.Status, p.Keterangan || '-']);
        doc.autoTable({ startY, head, body, theme: 'grid', styles: { fontSize: 9 } });
      } 
      else if (jenis === 'iuran') {
        drawHeader("LAPORAN IURAN WAJIB (PEMASUKAN & PENGELUARAN)");
        const filtered = iuran.filter(i => i.Bulan === bulanLaporan);
        head = [['No', 'Nama Anggota', 'Status Bayar', 'Tanggal Bayar', 'Nominal']];
        let total = 0;
        body = filtered.map((r, i) => {
          if (r.StatusBayar === 'Lunas') total += Number(r.Nominal || 0);
          return [i + 1, r.NamaAnggota, r.StatusBayar, r.TanggalBayar ? formatTanggal(r.TanggalBayar) : '-', formatRupiah(r.Nominal)];
        });
        doc.autoTable({ startY, head, body, theme: 'grid', styles: { fontSize: 9 } });
        
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text(`Total Pemasukan Kas: Rp ${total.toLocaleString('id-ID')}`, 14, finalY);
        // Catatan: Karena DB Backend belum mencatat tabel pengeluaran, kita set statik 0 sementara
        doc.text(`Total Pengeluaran Kas: Rp 0`, 14, finalY + 6); 
        doc.text(`Saldo Kas Saat Ini: Rp ${total.toLocaleString('id-ID')}`, 14, finalY + 12);
      } 
      else if (jenis === 'arisan') {
        drawHeader("LAPORAN ARISAN BULANAN");
        const filtered = arisan.filter(a => a.Bulan === bulanLaporan);
        head = [['No', 'Nama Anggota', 'Status Bayar', 'Pemenang', 'Nominal']];
        let total = 0;
        body = filtered.map((r, i) => {
          if (r.StatusBayar === 'Lunas') total += Number(r.Nominal || 0);
          return [i + 1, r.NamaAnggota, r.StatusBayar, r.Pemenang === 'Y' ? 'YA (PEMENANG)' : '-', formatRupiah(r.Nominal)];
        });
        doc.autoTable({ startY, head, body, theme: 'grid', styles: { fontSize: 9 } });
        
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text(`Total Dana Arisan Terkumpul: Rp ${total.toLocaleString('id-ID')}`, 14, finalY);
      }

      doc.save(`Laporan_${jenis}_${bulanLaporan}.pdf`);
      showToast(`Laporan ${jenis} berhasi di-download (PDF)!`);
    } catch (err) {
      console.error(err);
      showToast("Gagal membuat PDF. Pastikan koneksi stabil.", "bad");
    }
  };

  return (
    <div className="animate-slideDown space-y-8">
      <SectionHeader eyebrow="Konfigurasi" title="Pengaturan & Laporan" desc="Atur aset dan akses menu untuk mengunduh laporan PDF operasional." />
      
      {/* CARD PENGATURAN LOGO */}
      <div className="p-8 md:p-10 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl max-w-2xl relative overflow-hidden">
        <div className="absolute top-0 right-0 w-64 h-64 bg-slate-50 rounded-bl-[150px] -z-10"></div>
        <h3 className="font-serif font-black text-2xl mb-8 text-slate-900 border-b border-slate-100 pb-5">Logo Organisasi</h3>
        
        <div className="flex flex-col md:flex-row items-center gap-8">
          <div className="w-32 h-32 md:w-40 md:h-40 rounded-full overflow-hidden border-4 border-surface shadow-[0_10px_25px_rgba(0,0,0,0.1)] shrink-0 bg-brand-900 flex items-center justify-center relative group">
             {logoB64 ? (
               <img src={logoB64} alt="Logo" className="absolute inset-0 w-full h-full object-cover scale-[1.25] origin-center transition-transform group-hover:scale-[1.35]" />
             ) : (
               <span className="font-serif font-black text-brand-300 text-4xl">KT</span>
             )}
             <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10">
               <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
             </div>
          </div>
          
          <div className="flex-1 text-center md:text-left">
            <h4 className="text-lg font-bold text-slate-900 mb-2">Unggah Logo Resmi</h4>
            <p className="text-sm text-slate-500 mb-6 font-medium leading-relaxed">Gunakan gambar format JPG atau PNG. Sistem akan memotong (auto-crop) bagian tengahnya menjadi bulat presisi.</p>
            
            <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
            <button onClick={() => fileInputRef.current.click()} className="px-8 py-3.5 rounded-xl text-sm font-bold bg-brand-900 text-white hover:bg-brand-950 transition-colors shadow-lg shadow-brand-900/30">
              Pilih Gambar Baru
            </button>
          </div>
        </div>
      </div>

      {/* CARD MENU LAPORAN */}
      <div className="p-8 md:p-10 rounded-[2.5rem] bg-white border border-brand-200 shadow-xl max-w-4xl relative overflow-hidden">
        <div className="absolute top-0 right-0 w-64 h-64 bg-brand-50 rounded-bl-[150px] -z-10"></div>
        
        <h3 className="font-serif font-black text-2xl mb-2 text-slate-900">Pusat Cetak Laporan (PDF)</h3>
        <p className="text-sm text-slate-500 mb-8 font-medium border-b border-slate-100 pb-5">Dicetak dalam Format PDF ukuran Kertas F4 Standar Indonesia (21.5cm x 33cm).</p>
        
        <div className="mb-8">
           <label className="block text-xs font-bold mb-2.5 text-slate-700 tracking-wide uppercase">Pilih Periode Laporan (Bulan/Tahun)</label>
           <input type="month" value={bulanLaporan} onChange={(e) => setBulanLaporan(e.target.value)} className="w-full max-w-sm px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-bold text-brand-900 focus:ring-2 focus:ring-brand-500 outline-none shadow-sm cursor-pointer" />
        </div>

        <div className="grid md:grid-cols-2 gap-5">
           <button onClick={() => handleCetakPDF('anggota')} className="flex flex-col text-left p-6 rounded-2xl border-[3px] border-slate-100 hover:border-brand-400 hover:bg-brand-50 transition-all shadow-sm group">
             <span className="font-black text-lg text-slate-900 group-hover:text-brand-800">Laporan Anggota Lengkap</span>
             <span className="text-xs text-slate-500 mt-2 leading-relaxed">Cetak seluruh direktori data anggota dan kepemilikan lahan secara lengkap.</span>
           </button>
           
           <button onClick={() => handleCetakPDF('pupuk')} className="flex flex-col text-left p-6 rounded-2xl border-[3px] border-slate-100 hover:border-brand-400 hover:bg-brand-50 transition-all shadow-sm group">
             <span className="font-black text-lg text-slate-900 group-hover:text-brand-800">Laporan Distribusi Pupuk</span>
             <span className="text-xs text-slate-500 mt-2 leading-relaxed">Laporan penerima kuota pupuk pada periode {bulanLabel(bulanLaporan)}.</span>
           </button>

           <button onClick={() => handleCetakPDF('iuran')} className="flex flex-col text-left p-6 rounded-2xl border-[3px] border-slate-100 hover:border-brand-400 hover:bg-brand-50 transition-all shadow-sm group">
             <span className="font-black text-lg text-slate-900 group-hover:text-brand-800">Laporan Iuran Wajib</span>
             <span className="text-xs text-slate-500 mt-2 leading-relaxed">Cetak ringkasan kas masuk dan pengeluaran pada periode {bulanLabel(bulanLaporan)}.</span>
           </button>
           
           <button onClick={() => handleCetakPDF('arisan')} className="flex flex-col text-left p-6 rounded-2xl border-[3px] border-slate-100 hover:border-brand-400 hover:bg-brand-50 transition-all shadow-sm group">
             <span className="font-black text-lg text-slate-900 group-hover:text-brand-800">Laporan Arisan Bulanan</span>
             <span className="text-xs text-slate-500 mt-2 leading-relaxed">Cetak kas pemasukan arisan beserta pemenang di periode {bulanLabel(bulanLaporan)}.</span>
           </button>
        </div>

      </div>
    </div>
  );
}

    setModalOpen(true);

              </div>
              <div className="grid grid-cols-2 gap-5">
                <div><label className="block text-xs font-bold mb-2 text-slate-700 tracking-wide uppercase">Luas Lahan (Ha)</label><input type="number" step="0.1" value={form.LuasLahan_Ha} onChange={e=>setForm({...form, LuasLahan_Ha: e.target.value})} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
                <div><label className="block text-xs font-bold mb-2 text-slate-700 tracking-wide uppercase">Komoditas Lahan</label><input value={form.Komoditas} onChange={e=>setForm({...form, Komoditas: e.target.value})} placeholder="Padi, Jagung..." className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-semibold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
              </div>
              <div>
                <label className="block text-xs font-bold mb-2 text-slate-700 tracking-wide uppercase">Status Keanggotaan</label>
                <select value={form.Status} onChange={e=>setForm({...form, Status: e.target.value})} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none appearance-none">
                  <option value="Aktif">Aktif Mengikuti Program</option>
                  <option value="Non-Aktif">Non-Aktif / Mengundurkan Diri</option>
                </select>
              </div>
            </div>

            <div className="p-6 border-t border-slate-100 flex gap-4 bg-slate-50">
              <button onClick={() => setModalOpen(false)} className="flex-1 px-5 py-4 rounded-2xl text-sm font-bold border-2 border-slate-200 text-slate-600 hover:bg-white transition-colors">Batalkan</button>
              <button onClick={handleSave} className="flex-1 px-5 py-4 rounded-2xl text-sm font-bold bg-brand-900 text-white hover:bg-brand-950 transition-colors shadow-xl shadow-brand-900/30">Simpan ke Database</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= PUPUK =================
function PupukTab({ antreanPupuk, riwayat, isAdmin, onDistribusi }) {
  const [form, setForm] = useState({ tanggal: new Date().toISOString().slice(0, 10), jumlahPerOrang: 50, keterangan: "", kuota: Math.ceil(antreanPupuk.length / 2) || 1 });
  const [pilihan, setPilihan] = useState(() => new Set(antreanPupuk.slice(0, form.kuota).map((a) => a.id)));
  const [showForm, setShowForm] = useState(false);

  function syncKuota(kuota) {
    setForm({ ...form, kuota }); setPilihan(new Set(antreanPupuk.slice(0, kuota).map((a) => a.id)));
  }

  return (
    <div className="animate-slideDown">
      <SectionHeader eyebrow="Operasional" title="Distribusi Pupuk" desc="Modul alokasi pupuk bersubsidi dengan sistem rotasi berkeadilan." />

      {isAdmin && (
        <div className="mb-10">
          {!showForm ? (
            <button onClick={() => setShowForm(true)} className="px-7 py-4 rounded-2xl text-sm font-bold bg-brand-900 text-white hover:bg-brand-950 shadow-xl shadow-brand-900/30 transition-all flex items-center gap-3">
               <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"></path></svg> Catat Eksekusi Distribusi Baru
            </button>
          ) : (
            <div className="p-7 md:p-10 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl">
              <h3 className="font-serif font-black text-2xl mb-8 text-slate-900 border-b border-slate-100 pb-5">Form Alokasi Distribusi</h3>
              <div className="grid md:grid-cols-3 gap-6 mb-6">
                <div><label className="block text-xs font-bold mb-2.5 text-slate-700 tracking-wide uppercase">Tanggal Eksekusi</label><input type="date" value={form.tanggal} onChange={(e) => setForm({ ...form, tanggal: e.target.value })} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
                <div><label className="block text-xs font-bold mb-2.5 text-slate-700 tracking-wide uppercase">Berat (Kg) / Orang</label><input type="number" value={form.jumlahPerOrang} onChange={(e) => setForm({ ...form, jumlahPerOrang: Number(e.target.value) })} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
                <div><label className="block text-xs font-bold mb-2.5 text-slate-700 tracking-wide uppercase">Kuota Anggota</label><input type="number" min={1} max={antreanPupuk.length} value={form.kuota} onChange={(e) => syncKuota(Number(e.target.value))} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
              </div>
              <label className="block text-xs font-bold mb-2.5 text-slate-700 tracking-wide uppercase">Keterangan / Catatan (Opsional)</label>
              <input value={form.keterangan} onChange={(e) => setForm({ ...form, keterangan: e.target.value })} placeholder="mis. Distribusi Kuota Agustus Tahap 1" className="w-full mb-8 px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-semibold focus:ring-2 focus:ring-brand-500 outline-none" />

              <div className="p-6 bg-surface rounded-3xl border border-slate-200 mb-8">
                 <p className="text-xs font-bold text-brand-700 mb-5 tracking-widest uppercase flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-brand-500"></div> Daftar Auto-Seleksi Penerima ({form.kuota} Orang)</p>
                 <div className="max-h-56 overflow-y-auto hide-scroll space-y-2.5 pr-2">
                   {antreanPupuk.map((a) => (
                     <label key={a.id} className="flex items-center gap-4 p-4 rounded-xl bg-white border border-slate-200 hover:border-brand-400 cursor-pointer transition-all shadow-sm group">
                       <input type="checkbox" checked={pilihan.has(a.id)} className="w-5 h-5 rounded text-brand-600 focus:ring-brand-500" onChange={(e) => {
                         const next = new Set(pilihan); e.target.checked ? next.add(a.id) : next.delete(a.id); setPilihan(next);
                       }} />
                       <span className="text-sm font-bold text-slate-900 group-hover:text-brand-700 transition-colors">{a.nama}</span>
                       <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-3 py-1.5 rounded-lg ml-auto border border-slate-200">{a.terakhir ? formatTanggal(a.terakhir) : "Belum Pernah"}</span>
                     </label>
                   ))}
                 </div>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setShowForm(false)} className="px-8 py-4 rounded-2xl text-sm font-bold border-2 border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors">Batalkan</button>
                <button onClick={() => { onDistribusi({ ...form, anggotaIdTerpilih: JSON.stringify([...pilihan]) }); setShowForm(false); }} className="px-8 py-4 rounded-2xl text-sm font-bold bg-brand-900 text-white hover:bg-brand-950 transition-colors shadow-xl shadow-brand-900/30">Eksekusi Distribusi</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div className="grid lg:grid-cols-2 gap-8 md:gap-10">
        <div className="flex flex-col">
          <h3 className="text-[11px] font-bold mb-4 uppercase tracking-widest text-slate-500 font-mono">Real-Time Antrean</h3>
          <div className="rounded-[2rem] bg-white border border-slate-200 shadow-sm overflow-hidden flex-1">
            {antreanPupuk.map((a, i) => (
              <div key={a.id} className="flex items-center justify-between p-5 text-sm border-b border-slate-100 last:border-0 hover:bg-surface transition-colors">
                <span className="font-bold text-slate-900"><span className="font-mono font-bold text-slate-400 mr-4 text-xs bg-surface px-2 py-1 rounded">{String(i + 1).padStart(2, "0")}</span>{a.nama}</span>
                <span className="text-xs font-bold text-slate-500">{a.terakhir ? formatTanggal(a.terakhir) : "Belum pernah"}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="flex flex-col">
          <h3 className="text-[11px] font-bold mb-4 uppercase tracking-widest text-slate-500 font-mono">Log Transaksi Keluar</h3>
          <div className="rounded-[2rem] bg-white border border-slate-200 shadow-sm overflow-hidden h-[500px] flex flex-col">
            <div className="overflow-auto hide-scroll flex-1">
              <table className="ledger-table min-w-full">
                <thead className="ledger-head sticky top-0 bg-white shadow-sm z-10"><tr><th>Tanggal</th><th>Nama</th><th>Total</th><th>Status</th></tr></thead>
                <tbody>
                  {[...riwayat].reverse().map((r, idx) => (
                    <tr key={r.ID || idx} className="ledger-row">
                      <td className="text-xs font-bold text-slate-500 whitespace-nowrap">{formatTanggal(r.Tanggal)}</td>
                      <td className="font-bold text-slate-900">{r.NamaAnggota}</td>
                      <td className="text-slate-600 font-mono text-sm font-bold">{r.Jumlah_Kg || "-"} <span className="text-[10px] font-sans text-slate-400">Kg</span></td>
                      <td><Badge tone={r.Status === "Dapat" ? "good" : "warn"}>{r.Status}</Badge></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ================= KEUANGAN =================
function KeuanganTab({ arisan, iuran, anggota, isAdmin, onCatat }) {
  const [form, setForm] = useState({
    bulan: new Date().toISOString().slice(0, 7),
    anggotaId: anggota[0]?.ID || "",
    nominalIuran: 25000,
    nominalArisan: 50000,
    bayarIuran: false,
    bayarArisan: false,
    pemenangArisan: false
  });

  const handleSubmit = () => {
    if (!form.bayarIuran && !form.bayarArisan && !form.pemenangArisan) {
      alert("Pilih minimal satu instrumen keuangan untuk di-posting."); return;
    }
    onCatat(form);
    setForm({...form, bayarIuran: false, bayarArisan: false, pemenangArisan: false});
  };

  const arisanByBulan = useMemo(() => {
    const map = {}; arisan.forEach((a) => { (map[a.Bulan] = map[a.Bulan] || []).push(a); });
    return Object.entries(map).sort((a, b) => b[0].localeCompare(a[0]));
  }, [arisan]);

  const iuranByBulan = useMemo(() => {
    const map = {}; iuran.forEach((a) => { (map[a.Bulan] = map[a.Bulan] || []).push(a); });
    return Object.entries(map).sort((a, b) => b[0].localeCompare(a[0]));
  }, [iuran]);

  return (
    <div className="animate-slideDown">
      <SectionHeader eyebrow="Buku Kas Besar" title="Arisan & Iuran" desc="Modul terintegrasi untuk pencatatan masuknya dana iuran wajib dan arisan." />

      {isAdmin && (
        <div className="mb-10 p-7 md:p-10 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl relative overflow-hidden">
           <div className="absolute top-0 right-0 w-64 h-64 bg-surface rounded-bl-[150px] -z-10"></div>
          <h3 className="font-serif font-black text-2xl mb-8 text-slate-900 border-b border-slate-100 pb-5">Posting Pembayaran Kas</h3>
          
          <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div><label className="block text-[11px] font-bold mb-2.5 text-slate-500 tracking-widest uppercase font-mono">Periode Bulan</label><input type="month" value={form.bulan} onChange={(e) => setForm({ ...form, bulan: e.target.value })} className="w-full px-5 py-3.5 rounded-xl bg-white border-2 border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none font-bold text-slate-700 shadow-sm" /></div>
            <div><label className="block text-[11px] font-bold mb-2.5 text-slate-500 tracking-widest uppercase font-mono">Nama Anggota</label><select value={form.anggotaId} onChange={(e) => setForm({ ...form, anggotaId: e.target.value })} className="w-full px-5 py-3.5 rounded-xl bg-white border-2 border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none font-black text-brand-900 shadow-sm">{anggota.map((a) => <option key={a.ID} value={a.ID}>{a.Nama}</option>)}</select></div>
            <div><label className="block text-[11px] font-bold mb-2.5 text-slate-500 tracking-widest uppercase font-mono">Tarif Iuran</label><input type="number" value={form.nominalIuran} onChange={(e) => setForm({ ...form, nominalIuran: Number(e.target.value) })} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-mono font-bold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
            <div><label className="block text-[11px] font-bold mb-2.5 text-slate-500 tracking-widest uppercase font-mono">Tarif Arisan</label><input type="number" value={form.nominalArisan} onChange={(e) => setForm({ ...form, nominalArisan: Number(e.target.value) })} className="w-full px-5 py-3.5 rounded-xl bg-surface border border-slate-200 text-sm font-mono font-bold focus:ring-2 focus:ring-brand-500 outline-none" /></div>
          </div>

          <div className="bg-surface p-6 rounded-3xl border border-slate-200 mb-8">
            <label className="block text-xs font-bold tracking-widest uppercase mb-5 text-slate-500 font-mono">Tandai Instrumen Pembayaran</label>
            <div className="grid md:grid-cols-3 gap-5">
              <label className={`flex items-center gap-5 cursor-pointer p-5 rounded-2xl border-[3px] transition-all shadow-sm ${form.bayarIuran ? "bg-brand-50 border-brand-500" : "bg-white border-slate-200 hover:border-brand-300"}`}>
                <input type="checkbox" checked={form.bayarIuran} onChange={(e) => setForm({ ...form, bayarIuran: e.target.checked })} className="w-6 h-6 rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
                <span className="text-base font-black text-slate-900 leading-tight">Bayar Iuran<br/><span className="text-xs font-mono font-bold text-brand-700">{formatRupiah(form.nominalIuran)}</span></span>
              </label>
              <label className={`flex items-center gap-5 cursor-pointer p-5 rounded-2xl border-[3px] transition-all shadow-sm ${form.bayarArisan ? "bg-brand-50 border-brand-500" : "bg-white border-slate-200 hover:border-brand-300"}`}>
                <input type="checkbox" checked={form.bayarArisan} onChange={(e) => setForm({ ...form, bayarArisan: e.target.checked })} className="w-6 h-6 rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
                <span className="text-base font-black text-slate-900 leading-tight">Bayar Arisan<br/><span className="text-xs font-mono font-bold text-brand-700">{formatRupiah(form.nominalArisan)}</span></span>
              </label>
              <label className={`flex items-center gap-5 cursor-pointer p-5 rounded-2xl border-[3px] transition-all shadow-sm ${form.pemenangArisan ? "bg-accent-50 border-accent-500" : "bg-white border-slate-200 hover:border-accent-300"}`}>
                <input type="checkbox" checked={form.pemenangArisan} onChange={(e) => setForm({ ...form, pemenangArisan: e.target.checked })} className="w-6 h-6 rounded border-slate-300 text-accent-500 focus:ring-accent-500" />
                <span className="text-base font-black text-slate-900 leading-tight">Menang Arisan<br/><span className="text-xs font-bold text-accent-700">Tandai Pemenang</span></span>
              </label>
            </div>
          </div>
          
          <button onClick={handleSubmit} className="px-10 py-4 rounded-2xl text-sm font-bold bg-brand-900 text-white hover:bg-brand-950 transition-colors shadow-xl shadow-brand-900/30">Posting ke Database Kas</button>
        </div>
      )}

      <div className="grid lg:grid-cols-2 gap-8 md:gap-10">
        <div>
          <h3 className="text-xl font-serif font-black mb-5 text-brand-950 flex items-center gap-3">
             <span className="w-3 h-8 bg-brand-500 rounded-full inline-block shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span> Ledger Iuran
          </h3>
          <div className="space-y-6">
            {iuranByBulan.map(([bulan, rows]) => {
              const lunas = rows.filter((r) => r.StatusBayar === "Lunas").length;
              return (
                <div key={`iuran-${bulan}`} className="rounded-[2rem] bg-white border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-6 py-5 flex items-center justify-between bg-surface border-b border-slate-100">
                    <span className="font-black text-base text-slate-900">{bulanLabel(bulan)}</span>
                    <span className="text-xs font-bold px-4 py-1.5 bg-white border border-slate-200 rounded-lg text-brand-700 shadow-sm">{lunas} Anggota Lunas</span>
                  </div>
                  <div className="overflow-x-auto hide-scroll pb-2">
                    <table className="ledger-table">
                      <tbody>
                        {rows.map((r, i) => (
                          <tr key={r.ID || i} className="ledger-row">
                            <td className="font-bold text-slate-900">{r.NamaAnggota}</td>
                            <td className="text-slate-500 font-mono text-xs font-bold">{formatRupiah(r.Nominal)}</td>
                            <td className="text-right"><Badge tone={r.StatusBayar === "Lunas" ? "good" : "bad"}>{r.StatusBayar}</Badge></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <h3 className="text-xl font-serif font-black mb-5 text-brand-950 flex items-center gap-3">
            <span className="w-3 h-8 bg-accent-500 rounded-full inline-block shadow-[0_0_10px_rgba(245,158,11,0.5)]"></span> Ledger Arisan
          </h3>
          <div className="space-y-6">
            {arisanByBulan.map(([bulan, rows]) => (
              <div key={`arisan-${bulan}`} className="rounded-[2rem] bg-white border border-slate-200 shadow-sm overflow-hidden">
                <div className="px-6 py-5 flex items-center justify-between bg-surface border-b border-slate-100 flex-wrap gap-2">
                  <span className="font-black text-base text-slate-900">{bulanLabel(bulan)}</span>
                  {rows.find((r) => r.Pemenang === "Y") && (
                    <span className="text-[11px] font-black flex items-center gap-2 text-accent-900 bg-accent-100 border border-accent-200 px-3 py-1.5 rounded-lg shadow-sm tracking-wide">
                       🏆 {rows.find((r) => r.Pemenang === "Y").NamaAnggota}
                    </span>
                  )}
                </div>
                <div className="overflow-x-auto hide-scroll pb-2">
                  <table className="ledger-table">
                    <tbody>
                      {rows.map((r, i) => (
                        <tr key={r.ID || i} className="ledger-row">
                          <td className="font-bold text-slate-900">{r.NamaAnggota}</td>
                          <td className="text-slate-500 font-mono text-xs font-bold">{formatRupiah(r.Nominal)}</td>
                          <td className="text-right">
                             {r.Pemenang === "Y" ? <Badge tone="warn">Pemenang</Badge> : <Badge tone={r.StatusBayar === "Lunas" ? "good" : "bad"}>{r.StatusBayar}</Badge>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
