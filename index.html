<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kelompok Tani Makmur Jaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'], serif: ['Fraunces', 'serif'], mono: ['IBM Plex Mono', 'monospace'],
        },
        colors: {
          brand: {
            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22'
          },
          accent: { 500: '#f59e0b', 600: '#d97706' }, surface: '#F4F7F6'
        }
      }
    }
  }
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
  Babel.registerPreset('react-classic', { presets: [ [Babel.availablePresets['react'], { "runtime": "classic" }] ] });
</script>

<style>
  body { margin: 0; background-color: #F4F7F6; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  ::selection { background: #059669; color: white; }
  
  .table-wrapper { width: 100%; max-height: 65vh; overflow: auto; border-radius: 0.5rem; }
  .table-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
  .table-wrapper::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  .ledger-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 650px; }
  .ledger-row td { border-bottom: 1px solid #E2E8F0; padding: 14px 16px; font-size: 14px; color: #1E293B; transition: background 0.2s; white-space: nowrap; }
  .ledger-row:hover td { background: #F8FAFC; }
  .ledger-head th { position: sticky; top: 0; z-index: 10; text-align: left; padding: 14px 16px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: #475569; border-bottom: 2px solid #CBD5E1; font-family: 'IBM Plex Mono', monospace; font-weight: 700; background: #F1F5F9; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,0.05);}
  
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/**
 * ============================================================
 * PASTIKAN URL API INI SUDAH DIPERBARUI DENGAN DEPLOYMENT BARU
 * ============================================================
 */
const API_URL = "https://script.google.com/macros/s/AKfycbz_G2Xl1sllRyp9AqjszXFOskt7l-XnnJ1XasTkqA3ZwgPt0-ZaIxzzqodYhnbdWtce/exec";

const BULAN_ID = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
function formatTanggal(d) {
  if (!d) return "-"; const date = new Date(d); if (isNaN(date)) return String(d);
  return `${date.getDate()} ${BULAN_ID[date.getMonth()]} ${date.getFullYear()}`;
}
function formatRupiah(n) { return "Rp " + Number(n || 0).toLocaleString("id-ID"); }
function bulanLabel(b) {
  if (!b) return "-"; const [y, m] = String(b).split("-");
  return `${BULAN_ID[parseInt(m, 10) - 1]} ${y}`;
}

function Badge({ children, tone = "neutral" }) {
  const tones = { neutral: "bg-slate-100 text-slate-700 border-slate-200", good: "bg-brand-50 text-brand-800 border-brand-200", warn: "bg-accent-50 text-accent-800 border-accent-200", bad: "bg-rose-50 text-rose-800 border-rose-200", };
  return <span className={`px-2.5 py-1 rounded-md text-[11px] font-bold border ${tones[tone]} font-mono tracking-tight`}>{children}</span>;
}

function SectionHeader({ eyebrow, title, desc, action }) {
  return (
    <div className="mb-8 md:mb-10 flex flex-col md:flex-row md:items-end justify-between gap-5">
      <div>
        <div className="text-[11px] tracking-widest uppercase mb-2 text-brand-600 font-mono font-bold">{eyebrow}</div>
        <h2 className="text-3xl md:text-4xl font-serif font-black text-slate-900 tracking-tight">{title}</h2>
        {desc && <p className="text-sm text-slate-500 max-w-2xl mt-2.5 font-medium leading-relaxed">{desc}</p>}
      </div>
      {action && <div>{action}</div>}
    </div>
  );
}

// ================= APP ROOT =================
function App() {
  const [tab, setTab] = useState("dashboard");
  const [token, setToken] = useState(null);
  const [loginOpen, setLoginOpen] = useState(false);
  const [loginForm, setLoginForm] = useState({ username: "", password: "" });
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  const [anggota, setAnggota] = useState([]);
  const [pupukRiwayat, setPupukRiwayat] = useState([]);
  const [arisan, setArisan] = useState([]);
  const [iuran, setIuran] = useState([]);
  const [pengeluaran, setPengeluaran] = useState([]);
  const [galeri, setGaleri] = useState([]);
  
  const [logoB64, setLogoB64] = useState(null);
  const [kopSurat, setKopSurat] = useState({ nama: '', pemerintahan: '', alamat: '' });
  
  const [editModal, setEditModal] = useState({ open: false, type: '', data: null });

  const isAdmin = !!token;

  function showToast(msg, tone = "good") {
    setToast({ msg, tone }); setTimeout(() => setToast(null), 3500);
  }

  async function apiCall(action, data = {}, method = "GET") {
    setLoading(true);
    try {
      const res = await fetch(method === "GET" ? `${API_URL}?action=${action}` : API_URL, {
        method, body: method === "POST" ? JSON.stringify({ action, token, ...data }) : undefined,
      });
      return await res.json();
    } catch (err) {
      showToast("Gagal terhubung ke server", "bad"); return null;
    } finally { setLoading(false); }
  }

  const loadAllData = async () => {
    const [a, p, ar, ir, ex, gl, lg, kop] = await Promise.all([
      apiCall("getAnggota"), apiCall("getPupukStatus"), apiCall("getArisan"), apiCall("getIuran"), apiCall("getPengeluaran"), apiCall("getGaleri"), apiCall("getLogo"), apiCall("getKopSurat")
    ]);
    if (a?.success) setAnggota(a.data);
    if (p?.success) setPupukRiwayat(p.riwayat);
    if (ar?.success) setArisan(ar.data);
    if (ir?.success) setIuran(ir.data);
    if (ex?.success) setPengeluaran(ex.data);
    if (gl?.success) setGaleri(gl.data);
    if (lg?.success && lg.base64) setLogoB64(lg.base64);
    if (kop?.success) setKopSurat(kop.data);
  };

  useEffect(() => { loadAllData(); }, []);

  async function handleLogin() {
    const res = await apiCall("login", { username: loginForm.username, password: loginForm.password }, "POST");
    if (res?.success) {
      setToken(res.token); setLoginOpen(false); showToast("Sesi Admin Terbuka");
    } else showToast(res?.message || "Kredensial tidak valid", "bad");
  }

  const handleDelete = async (sheetName, id) => {
    if(!window.confirm(`PERINGATAN!\nApakah Anda yakin ingin menghapus data ini secara permanen?`)) return;
    const res = await apiCall("deleteData", { sheet: sheetName, id }, "POST");
    if (res?.success) { showToast("Data dihapus!"); loadAllData(); } else { showToast("Gagal menghapus data", "bad"); }
  }

  const handleUpdate = async (sheetName, id, updatesObj) => {
    const res = await apiCall("updateData", { sheet: sheetName, id, updates: JSON.stringify(updatesObj) }, "POST");
    if (res?.success) { showToast("Data diperbarui!"); setEditModal({open: false}); loadAllData(); } else { showToast("Gagal memperbarui", "bad"); }
  }

  const navItems = [
    { key: "dashboard", label: "Ringkasan Eksekutif", icon: "M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" },
    { key: "anggota", label: "Database Anggota", icon: "M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" },
    { key: "pupuk", label: "Distribusi Pupuk", icon: "M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" },
    { key: "keuangan", label: "Arisan & Iuran", icon: "M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" },
    { key: "pengeluaran", label: "Pengeluaran Kas", icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" },
    { key: "galeri", label: "Pusat Galeri", icon: "M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" }
  ];
  if (isAdmin) {
    navItems.push({ key: "pengaturan", label: "Pengaturan & Laporan", icon: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z" });
  }

  const antreanPupuk = useMemo(() => {
    const aktif = anggota.filter((a) => a.Status === "Aktif");
    const list = aktif.map((a) => {
      const riwayatSaya = pupukRiwayat.filter((r) => r.AnggotaID === a.ID && r.Status === "Dapat");
      let terakhir = null;
      riwayatSaya.forEach((r) => { const t = new Date(r.Tanggal); if (!terakhir || t > terakhir) terakhir = t; });
      return { id: a.ID, nama: a.Nama, terakhir, totalDapat: riwayatSaya.length };
    });
    list.sort((x, y) => {
      if (!x.terakhir && !y.terakhir) return x.totalDapat - y.totalDapat;
      if (!x.terakhir) return -1; if (!y.terakhir) return 1;
      return x.terakhir - y.terakhir;
    });
    return list;
  }, [anggota, pupukRiwayat]);

  const stats = useMemo(() => {
    const tIuran = iuran.filter((i) => i.StatusBayar === "Lunas").reduce((s, i) => s + Number(i.Nominal || 0), 0);
    const tKeluar = pengeluaran.reduce((s, p) => s + Number(p.Nominal || 0), 0);
    const saldoKas = tIuran - tKeluar;

    let arisanPerBulan = {};
    arisan.forEach(a => { arisanPerBulan[a.Bulan] = (arisanPerBulan[a.Bulan] || 0) + Number(a.Nominal || 0); });
    const bulanTerakhir = Object.keys(arisanPerBulan).sort().reverse()[0];
    const jumlahMenangArisan = bulanTerakhir ? arisanPerBulan[bulanTerakhir] : 0;

    return {
      totalAnggota: anggota.filter((a) => a.Status === "Aktif").length,
      saldoKas: saldoKas,
      jumlahMenangArisan: jumlahMenangArisan,
      totalPengeluaran: tKeluar,
      totalPupuk: pupukRiwayat.filter((p) => p.Status === "Dapat").reduce((s, p) => s + Number(p.Jumlah_Kg || 0), 0)
    };
  }, [anggota, iuran, arisan, pengeluaran, pupukRiwayat]);

  return (
    <div className="font-sans bg-surface min-h-screen text-slate-800 flex flex-col md:flex-row relative">
      {toast && (
        <div className={`fixed top-6 right-6 z-[60] px-6 py-4 rounded-xl shadow-2xl text-sm font-bold transition-all flex items-center gap-3 border ${toast.tone === "bad" ? "bg-rose-600 text-white border-rose-500" : "bg-brand-950 text-white border-brand-800"}`}>
          {toast.msg}
        </div>
      )}

      {/* SIDEBAR (Desktop) */}
      <aside className="w-full md:w-[310px] shrink-0 bg-brand-950 border-r border-brand-900 flex-col z-20 sticky top-0 h-screen hidden md:flex shadow-xl shadow-brand-900/20">
        <div className="p-6 lg:p-7 border-b border-brand-800/50 flex items-center gap-5 bg-gradient-to-br from-brand-950 to-brand-900">
          <div className="w-16 h-16 lg:w-20 lg:h-20 rounded-full overflow-hidden border-[3px] border-brand-400/80 shadow-[0_0_20px_rgba(52,211,153,0.4)] shrink-0 bg-brand-900 relative flex items-center justify-center bg-white">
             {logoB64 ? <img src={logoB64} alt="Logo" className="absolute inset-0 w-full h-full object-cover scale-[1.25] origin-center" /> : <span className="font-serif font-black text-brand-900 text-2xl">KT</span>}
          </div>
          <div className="flex flex-col justify-center pt-1">
            <div className="text-[11px] lg:text-xs tracking-[0.25em] uppercase text-brand-400 font-sans font-black mb-1 drop-shadow-sm">Kelompok Tani</div>
            <div className="font-serif font-black text-2xl lg:text-3xl text-white leading-none tracking-tight">
              Makmur <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 via-emerald-200 to-yellow-100">Jaya.</span>
            </div>
          </div>
        </div>
        <nav className="flex flex-col gap-2 p-5 w-full overflow-y-auto mt-2 hide-scroll">
          {navItems.map((item) => (
            <button key={item.key} onClick={() => setTab(item.key)} className={`flex items-center gap-4 px-5 py-4 rounded-2xl text-sm font-bold transition-all whitespace-nowrap w-full text-left ${tab === item.key ? "bg-brand-600 text-white shadow-lg shadow-brand-900/50 border border-brand-500/50" : "text-brand-300 hover:bg-brand-800/50 hover:text-white border border-transparent"}`}>
              <svg className="w-5 h-5 opacity-90" fill="currentColor" viewBox="0 0 20 20"><path d={item.icon} fillRule="evenodd" clipRule="evenodd"></path></svg>
              {item.label}
            </button>
          ))}
        </nav>
        <div className="p-5 pb-10 mt-auto border-t border-brand-800/50 bg-brand-900/20">
          {isAdmin ? (
            <div className="bg-brand-800/60 px-5 py-4 rounded-2xl border border-brand-700/50 backdrop-blur-sm shadow-inner">
              <span className="flex items-center gap-2 text-xs font-bold text-white mb-4"><div className="w-2.5 h-2.5 rounded-full bg-brand-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div> Admin Akses Penuh</span>
              <button onClick={() => setToken(null)} className="w-full text-xs font-bold text-rose-300 bg-rose-950/60 hover:bg-rose-900 py-3 rounded-xl transition-all shadow-sm">Logout Sistem</button>
            </div>
          ) : (
            <button onClick={() => setLoginOpen(true)} className="w-full px-5 py-4 rounded-2xl text-sm font-black bg-white text-brand-950 hover:bg-brand-50 shadow-[0_4px_15px_rgba(255,255,255,0.1)] border-b-4 border-slate-200 active:border-b-0 active:translate-y-1">
              LOGIN ADMINISTRATOR
            </button>
          )}
        </div>
      </aside>

      {/* MOBILE HEADER & HAMBURGER */}
      <div className="md:hidden flex items-center justify-between px-5 py-3 bg-gradient-to-r from-brand-950 to-brand-900 text-white border-b border-brand-800 z-40 sticky top-0 shadow-xl">
         <div className="flex items-center gap-4">
            <div className="w-14 h-14 rounded-full overflow-hidden border-2 border-brand-400/80 shadow-[0_0_12px_rgba(52,211,153,0.4)] shrink-0 bg-white relative flex items-center justify-center">
               {logoB64 ? <img src={logoB64} className="absolute inset-0 w-full h-full object-cover scale-[1.25]" /> : <span className="font-serif font-black text-brand-900 text-xl">KT</span>}
            </div>
            <div className="flex flex-col justify-center">
               <div className="text-[10px] tracking-[0.2em] uppercase text-brand-400 font-sans font-black mb-1">Kelompok Tani</div>
               <div className="font-serif font-black text-[22px] text-white leading-none">Makmur <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 via-emerald-200 to-yellow-100">Jaya.</span></div>
            </div>
         </div>
         <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 -mr-2 focus:outline-none text-brand-100 bg-brand-800/30 rounded-lg">
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">{mobileMenuOpen ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /> : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16" />}</svg>
         </button>
      </div>

      {/* MOBILE DROPDOWN MENU */}
      {mobileMenuOpen && (
        <div className="md:hidden fixed inset-0 z-30 bg-brand-950/80 backdrop-blur-md pt-[80px]" onClick={() => setMobileMenuOpen(false)}>
          <div className="bg-brand-900 shadow-2xl rounded-b-[2rem] border-t border-brand-800 p-5 flex flex-col gap-2 overflow-y-auto max-h-[90vh]" onClick={(e) => e.stopPropagation()}>
             {navItems.map((item) => (
              <button key={item.key} onClick={() => {setTab(item.key); setMobileMenuOpen(false);}} className={`flex items-center gap-4 px-5 py-4 rounded-2xl text-sm font-bold transition-all w-full text-left border ${tab === item.key ? "bg-brand-600 text-white border-brand-500 shadow-md" : "text-brand-200 border-transparent hover:bg-brand-800"}`}>
                <svg className="w-5 h-5 opacity-90" fill="currentColor" viewBox="0 0 20 20"><path d={item.icon} fillRule="evenodd" clipRule="evenodd"></path></svg> {item.label}
              </button>
            ))}
            <div className="mt-5 pt-5 border-t border-brand-800/50 px-1">
              {isAdmin ? (
                 <button onClick={() => {setToken(null); setMobileMenuOpen(false);}} className="w-full text-sm font-bold text-rose-300 bg-rose-950/50 py-4 rounded-xl shadow-inner">Logout Sistem</button>
              ) : (
                 <button onClick={() => {setLoginOpen(true); setMobileMenuOpen(false);}} className="w-full text-sm font-black text-brand-950 bg-white py-4 rounded-xl">LOGIN ADMINISTRATOR</button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* MAIN CONTENT */}
      <main className="flex-1 p-5 md:p-8 lg:p-12 max-w-6xl overflow-x-hidden pb-28 md:pb-24">
        {loading && <div className="fixed inset-0 bg-white/40 backdrop-blur-[2px] z-[55] flex items-center justify-center"><div className="w-12 h-12 border-4 border-brand-600 border-t-transparent rounded-full animate-spin shadow-xl"></div></div>}

        {tab === "dashboard" && <Dashboard stats={stats} antreanPupuk={antreanPupuk} arisan={arisan} />}
        {tab === "anggota" && <AnggotaTab anggota={anggota} isAdmin={isAdmin} apiCall={apiCall} onRefresh={loadAllData} showToast={showToast} handleDelete={handleDelete} handleUpdate={handleUpdate} />}
        {tab === "pupuk" && <PupukTab antreanPupuk={antreanPupuk} riwayat={pupukRiwayat} isAdmin={isAdmin} setEditModal={setEditModal} handleDelete={handleDelete}
            onDistribusi={async (payload) => { const res = await apiCall("distribusiPupuk", payload, "POST"); if (res?.success) { showToast("Distribusi berhasil dicatat"); loadAllData(); } }} />}
        {tab === "keuangan" && <KeuanganTab arisan={arisan} iuran={iuran} anggota={anggota} isAdmin={isAdmin} setEditModal={setEditModal} handleDelete={handleDelete}
            onCatat={async (payload) => {
              let successCount = 0; let errorMsg = "";
              if (payload.bayarIuran) { const res = await apiCall("catatIuran", { bulan: payload.bulan, anggotaId: payload.anggotaId, statusBayar: "Lunas", nominal: payload.nominalIuran }, "POST"); if (res?.success) successCount++; else errorMsg += "Gagal iuran. "; }
              if (payload.bayarArisan || payload.pemenangArisan) { const res = await apiCall("catatArisan", { bulan: payload.bulan, anggotaId: payload.anggotaId, statusBayar: payload.bayarArisan ? "Lunas" : "Belum", nominal: payload.nominalArisan, pemenang: payload.pemenangArisan ? "Y" : "N" }, "POST"); if (res?.success) successCount++; else errorMsg += "Gagal arisan. "; }
              if (successCount > 0) { showToast("Data Keuangan Diperbarui!"); loadAllData(); } else if (errorMsg) showToast(errorMsg, "bad");
            }} />}
        {tab === "pengeluaran" && <PengeluaranTab pengeluaran={pengeluaran} isAdmin={isAdmin} setEditModal={setEditModal} handleDelete={handleDelete} apiCall={apiCall} showToast={showToast} onRefresh={loadAllData} />}
        {tab === "galeri" && <GaleriTab galeri={galeri} isAdmin={isAdmin} handleDelete={handleDelete} />}

      {editModal.open && (

               {(editModal.type === 'Arisan' || editModal.type === 'Iuran' || editModal.type === 'Pengeluaran') && (<div><label className="block text-xs font-bold mb-1 text-slate-700">Nominal (Rp)</label><input type="number" className="w-full p-3 rounded-lg bg-surface border outline-none" value={editModal.data.Nominal} onChange={e => setEditModal({...editModal, data: {...editModal.data, Nominal: e.target.value}})} /></div>)}
               {(editModal.type === 'Arisan' || editModal.type === 'Iuran') && (<div><label className="block text-xs font-bold mb-1 text-slate-700">Status Bayar</label><select className="w-full p-3 rounded-lg bg-surface border outline-none" value={editModal.data.StatusBayar} onChange={e => setEditModal({...editModal, data: {...editModal.data, StatusBayar: e.target.value}})}><option>Lunas</option><option>Belum</option></select></div>)}
               {editModal.type === 'Arisan' && (<div><label className="block text-xs font-bold mb-1 text-slate-700">Pemenang</label><select className="w-full p-3 rounded-lg bg-surface border outline-none" value={editModal.data.Pemenang} onChange={e => setEditModal({...editModal, data: {...editModal.data, Pemenang: e.target.value}})}><option>Y</option><option>N</option></select></div>)}
               {editModal.type === 'Pengeluaran' && (<><div><label className="block text-xs font-bold mb-1 text-slate-700">Keterangan</label><input className="w-full p-3 rounded-lg bg-surface border outline-none" value={editModal.data.Keterangan} onChange={e => setEditModal({...editModal, data: {...editModal.data, Keterangan: e.target.value}})} /></div><div><label className="block text-xs font-bold mb-1 text-slate-700">Kategori</label><input className="w-full p-3 rounded-lg bg-surface border outline-none" value={editModal.data.Kategori} onChange={e => setEditModal({...editModal, data: {...editModal.data, Kategori: e.target.value}})} /></div></>)}
            </div>

      {/* LOGIN MODAL */}
      {loginOpen && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-brand-950/60 backdrop-blur-sm">

            <label className="block text-xs font-bold mb-2 text-slate-700">Kata Sandi</label>

          </div>
        </div>

  );
}

// ================= KOMPONEN TAB: ANGGOTA =================
function AnggotaTab({ anggota, isAdmin, apiCall, onRefresh, showToast, handleDelete, handleUpdate }) {
  const [q, setQ] = useState("");
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState(null);

  const filtered = anggota.filter((a) => a.Nama?.toLowerCase().includes(q.toLowerCase()));

  const openForm = (data = null) => {
    if (data) setForm(data); else setForm({ ID: "", Nama: "", NIK: "", NoHP: "", LuasLahan_Ha: "", Komoditas: "", Status: "Aktif" });
    setModalOpen(true);
  };

  const handleSave = async () => {
    if (!form.Nama) return showToast("Nama wajib diisi", "bad");
    const payload = { id: form.ID, nama: form.Nama, nik: form.NIK, noHp: form.NoHP, luasLahan: form.LuasLahan_Ha, komoditas: form.Komoditas, status: form.Status };
    const res = await apiCall(form.ID ? "updateData" : "addAnggota", form.ID ? {sheet: 'Anggota', id: form.ID, updates: JSON.stringify({Nama:form.Nama, NIK:form.NIK, NoHP:form.NoHP, LuasLahan_Ha:form.LuasLahan_Ha, Komoditas:form.Komoditas, Status:form.Status})} : payload, "POST");
    if (res?.success) { showToast("Data Diperbarui"); setModalOpen(false); onRefresh(); } else showToast("Gagal memproses", "bad");
  };

  return (
    <div className="animate-slideDown">
      <SectionHeader eyebrow="Database" title="Direktori Anggota" action={isAdmin && <button onClick={() => openForm()} className="px-6 py-3.5 rounded-2xl text-sm font-bold bg-brand-900 text-white shadow-lg">+ Registrasi Baru</button>} />
      <div className="mb-6 relative max-w-md"><input placeholder="Cari anggota..." value={q} onChange={(e) => setQ(e.target.value)} className="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-white" /></div>

      <div className="table-wrapper bg-white border border-slate-200 shadow-sm">
        <table className="ledger-table">
          <thead className="ledger-head"><tr><th>ID</th><th>Identitas Lengkap</th><th>Kontak</th><th>Lahan (Ha)</th><th>Status</th>{isAdmin && <th>Aksi</th>}</tr></thead>
          <tbody>
            {filtered.map((a) => (
              <tr key={a.ID} className="ledger-row">
                <td className="font-mono text-slate-400 font-medium text-xs">{a.ID}</td>
                <td className="font-bold text-slate-900 text-base">{a.Nama}</td>
                <td className="text-slate-500 text-xs font-mono">{a.NoHP || '-'}</td>
                <td className="text-slate-700 font-bold">{a.LuasLahan_Ha || 0}</td>
                <td><Badge tone={a.Status === "Aktif" ? "good" : "neutral"}>{a.Status}</Badge></td>
                {isAdmin && (
                  <td className="flex gap-2">
                    <button onClick={() => openForm(a)} className="px-3 py-1.5 bg-slate-100 rounded text-xs font-bold text-brand-700">Ubah</button>
                    <button onClick={() => handleDelete('Anggota', a.ID)} className="px-3 py-1.5 bg-rose-50 rounded text-xs font-bold text-rose-700">Hapus</button>
                  </td>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modalOpen && form && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-brand-950/70 backdrop-blur-sm">
          <div className="w-full max-w-lg rounded-[2.5rem] bg-white shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-6 border-b border-slate-100 bg-slate-50"><h3 className="text-2xl font-serif font-black">{form.ID ? "Ubah Data" : "Tambah Anggota"}</h3></div>
            <div className="p-6 overflow-y-auto hide-scroll space-y-4">
              <div><label className="block text-xs font-bold mb-1">Nama</label><input value={form.Nama} onChange={e=>setForm({...form, Nama: e.target.value})} className="w-full p-3 rounded-lg border bg-surface outline-none" /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-xs font-bold mb-1">NIK</label><input value={form.NIK} onChange={e=>setForm({...form, NIK: e.target.value})} className="w-full p-3 rounded-lg border bg-surface outline-none" /></div>
                <div><label className="block text-xs font-bold mb-1">HP</label><input value={form.NoHP} onChange={e=>setForm({...form, NoHP: e.target.value})} className="w-full p-3 rounded-lg border bg-surface outline-none" /></div>
                <div><label className="block text-xs font-bold mb-1">Luas (Ha)</label><input type="number" step="0.1" value={form.LuasLahan_Ha} onChange={e=>setForm({...form, LuasLahan_Ha: e.target.value})} className="w-full p-3 rounded-lg border bg-surface outline-none" /></div>
                <div><label className="block text-xs font-bold mb-1">Status</label><select value={form.Status} onChange={e=>setForm({...form, Status: e.target.value})} className="w-full p-3 rounded-lg border bg-surface outline-none"><option>Aktif</option><option>Non-Aktif</option></select></div>
              </div>
            </div>
            <div className="p-4 border-t flex gap-3">
              <button onClick={() => setModalOpen(false)} className="flex-1 p-3 rounded-xl font-bold border">Batal</button>
              <button onClick={handleSave} className="flex-1 p-3 rounded-xl font-bold bg-brand-900 text-white">Simpan</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= KOMPONEN TAB: PUPUK =================
function PupukTab({ antreanPupuk, riwayat, isAdmin, onDistribusi, setEditModal, handleDelete }) {
  const [form, setForm] = useState({ tanggal: new Date().toISOString().slice(0, 10), jumlahPerOrang: 50, keterangan: "", kuota: Math.ceil(antreanPupuk.length / 2) || 1 });
  const [pilihan, setPilihan] = useState(() => new Set(antreanPupuk.slice(0, form.kuota).map((a) => a.id)));
  const [showForm, setShowForm] = useState(false);

  function syncKuota(kuota) {
    setForm({ ...form, kuota }); setPilihan(new Set(antreanPupuk.slice(0, kuota).map((a) => a.id)));
  }

  return (
    <div className="animate-slideDown">
      <SectionHeader eyebrow="Operasional" title="Distribusi Pupuk" />
      
      {isAdmin && (
        <div className="mb-10">
          {!showForm ? (
            <button onClick={() => setShowForm(true)} className="px-7 py-4 rounded-2xl text-sm font-bold bg-brand-900 text-white shadow-lg">Catat Distribusi Baru</button>
          ) : (
            <div className="p-7 md:p-10 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl">
              <h3 className="font-serif font-black text-2xl mb-8 border-b pb-5">Form Alokasi Distribusi</h3>
              <div className="grid md:grid-cols-3 gap-6 mb-6">
                <div><label className="block text-xs font-bold mb-2">Tanggal</label><input type="date" value={form.tanggal} onChange={(e) => setForm({ ...form, tanggal: e.target.value })} className="w-full px-5 py-3.5 rounded-xl border bg-surface" /></div>
                <div><label className="block text-xs font-bold mb-2">Berat (Kg) / Orang</label><input type="number" value={form.jumlahPerOrang} onChange={(e) => setForm({ ...form, jumlahPerOrang: Number(e.target.value) })} className="w-full px-5 py-3.5 rounded-xl border bg-surface" /></div>
                <div><label className="block text-xs font-bold mb-2">Kuota Orang</label><input type="number" min={1} max={antreanPupuk.length} value={form.kuota} onChange={(e) => syncKuota(Number(e.target.value))} className="w-full px-5 py-3.5 rounded-xl border bg-surface" /></div>
              </div>
              <label className="block text-xs font-bold mb-2">Catatan</label>
              <input value={form.keterangan} onChange={(e) => setForm({ ...form, keterangan: e.target.value })} className="w-full mb-8 px-5 py-3.5 rounded-xl border bg-surface" />

              <div className="p-6 bg-surface rounded-3xl border border-slate-200 mb-8">
                 <p className="text-xs font-bold text-brand-700 mb-5 uppercase">Daftar Auto-Seleksi ({form.kuota} Orang)</p>
                 <div className="max-h-56 overflow-y-auto hide-scroll space-y-2.5">
                   {antreanPupuk.map((a) => (
                     <label key={a.id} className="flex items-center gap-4 p-4 rounded-xl bg-white border hover:border-brand-400 cursor-pointer shadow-sm">
                       <input type="checkbox" checked={pilihan.has(a.id)} className="w-5 h-5 rounded text-brand-600" onChange={(e) => {
                         const next = new Set(pilihan); e.target.checked ? next.add(a.id) : next.delete(a.id); setPilihan(next);
                       }} />
                       <span className="text-sm font-bold">{a.nama}</span>
                     </label>
                   ))}
                 </div>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setShowForm(false)} className="px-8 py-4 rounded-2xl text-sm font-bold border text-slate-600">Batal</button>
                <button onClick={() => { onDistribusi({ ...form, anggotaIdTerpilih: JSON.stringify([...pilihan]) }); setShowForm(false); }} className="px-8 py-4 rounded-2xl text-sm font-bold bg-brand-900 text-white shadow-lg">Eksekusi Distribusi</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div className="table-wrapper bg-white border border-slate-200 shadow-sm mt-8">
        <table className="ledger-table min-w-full">
          <thead className="ledger-head"><tr><th>Tanggal</th><th>Nama</th><th>Total</th><th>Status</th>{isAdmin && <th>Aksi</th>}</tr></thead>
          <tbody>
            {[...riwayat].reverse().map(r => (
              <tr key={r.ID} className="ledger-row">
                <td className="text-xs">{formatTanggal(r.Tanggal)}</td>
                <td className="font-bold">{r.NamaAnggota}</td>
                <td className="font-mono">{r.Jumlah_Kg} Kg</td>
                <td><Badge tone={r.Status === "Dapat" ? "good" : "warn"}>{r.Status}</Badge></td>
                {isAdmin && (
                   <td className="flex gap-2">
                     <button onClick={() => setEditModal({open:true, type:'Pupuk', data: r})} className="px-3 py-1.5 bg-slate-100 rounded text-xs font-bold text-brand-700">Ubah</button>
                     <button onClick={() => handleDelete('Pupuk', r.ID)} className="px-3 py-1.5 bg-rose-50 rounded text-xs font-bold text-rose-700">Hapus</button>
                   </td>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ================= KOMPONEN TAB: PENGELUARAN =================
function PengeluaranTab({ pengeluaran, isAdmin, setEditModal, handleDelete, apiCall, showToast, onRefresh }) {
  const [form, setForm] = useState({ tanggal: new Date().toISOString().slice(0,10), keterangan: "", nominal: "", kategori: "Operasional" });

  const handleSimpan = async () => {
    if(!form.keterangan || !form.nominal) return showToast("Lengkapi data!", "bad");
    const res = await apiCall("addPengeluaran", form, "POST");
    if(res?.success){ showToast("Pengeluaran dicatat"); setForm({...form, keterangan: "", nominal: ""}); onRefresh(); } else showToast("Gagal", "bad");
  };

  return (
    <div className="animate-slideDown">
      <SectionHeader eyebrow="Buku Pengeluaran" title="Arus Kas Keluar" />
      
      {isAdmin && (
        <div className="mb-10 p-7 md:p-10 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl">
          <h3 className="font-serif font-black text-xl mb-6 border-b pb-4">Tambah Pengeluaran Baru</h3>
          <div className="grid md:grid-cols-4 gap-4 mb-6">
            <div><label className="block text-xs font-bold mb-2">Tanggal</label><input type="date" value={form.tanggal} onChange={e=>setForm({...form, tanggal:e.target.value})} className="w-full p-3.5 rounded-xl border bg-surface" /></div>
            <div className="col-span-2"><label className="block text-xs font-bold mb-2">Keterangan / Tujuan</label><input placeholder="Contoh: Beli Terpal..." value={form.keterangan} onChange={e=>setForm({...form, keterangan:e.target.value})} className="w-full p-3.5 rounded-xl border bg-surface" /></div>
            <div><label className="block text-xs font-bold mb-2">Nominal</label><input type="number" value={form.nominal} onChange={e=>setForm({...form, nominal:e.target.value})} className="w-full p-3.5 rounded-xl border bg-surface" /></div>
          </div>
          <button onClick={handleSimpan} className="px-8 py-3.5 rounded-xl text-sm font-bold bg-rose-700 text-white shadow-lg">Posting Pengeluaran</button>
        </div>
      )}

      <div className="table-wrapper bg-white border border-slate-200 shadow-sm">
        <table className="ledger-table">
          <thead className="ledger-head"><tr><th>Tgl</th><th>Keterangan</th><th>Kategori</th><th>Nominal</th>{isAdmin && <th>Aksi</th>}</tr></thead>
          <tbody>
            {[...pengeluaran].reverse().map(p => (
              <tr key={p.ID} className="ledger-row">
                <td className="text-xs text-slate-500 font-bold">{formatTanggal(p.Tanggal)}</td>
                <td className="font-bold text-slate-900">{p.Keterangan}</td>
                <td><Badge tone="warn">{p.Kategori}</Badge></td>
                <td className="font-mono font-bold text-rose-600">{formatRupiah(p.Nominal)}</td>
                {isAdmin && (
                   <td className="flex gap-2">
                     <button onClick={() => setEditModal({open:true, type:'Pengeluaran', data: p})} className="px-3 py-1.5 bg-slate-100 rounded text-xs font-bold text-brand-700">Ubah</button>
                     <button onClick={() => handleDelete('Pengeluaran', p.ID)} className="px-3 py-1.5 bg-rose-50 rounded text-xs font-bold text-rose-700">Hapus</button>
                   </td>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ================= PUSAT GALERI (PUBLIK) =================
function GaleriTab({ galeri, isAdmin, handleDelete }) {
  return (
    <div className="animate-slideDown">
      <SectionHeader eyebrow="Dokumentasi" title="Pusat Galeri" desc="Kumpulan dokumentasi kegiatan kelompok tani." />
      
      {galeri.length === 0 ? (
        <div className="p-10 text-center bg-white border border-slate-200 rounded-[2rem] shadow-sm text-slate-500 font-medium">Belum ada dokumentasi yang diunggah.</div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          {[...galeri].reverse().map(g => (
            <div key={g.ID} className="bg-white rounded-[2rem] overflow-hidden border border-slate-200 shadow-sm group">
              <div className="h-48 overflow-hidden relative bg-slate-100">
                <img src={g.ImageBase64} alt={g.Judul} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
              </div>
              <div className="p-5">
                <h3 className="font-bold text-slate-900 text-lg leading-tight mb-1">{g.Judul}</h3>
                <p className="text-xs font-mono text-slate-500">{formatTanggal(g.Tanggal)}</p>
                {isAdmin && (
                  <button onClick={() => handleDelete('Galeri', g.ID)} className="mt-4 w-full py-2.5 rounded-xl bg-rose-50 text-rose-600 text-xs font-bold hover:bg-rose-100 transition-colors">Hapus Media</button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ================= PENGATURAN & LAPORAN (SUB-TAB SYSTEM) =================
function PengaturanTab({ logoB64, setLogoB64, kopSurat, setKopSurat, apiCall, showToast, anggota, pupukRiwayat, arisan, iuran, pengeluaran, onRefresh }) {
  const [activeSub, setActiveSub] = useState('kop'); // 'kop', 'galeri', 'cetak'
  const fileInputRef = useRef(null);
  const fileGaleriRef = useRef(null);
  const [bulanLaporan, setBulanLaporan] = useState(() => new Date().toISOString().slice(0, 7)); 
  const [judulGaleri, setJudulGaleri] = useState("");

  const handleUploadLogo = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        let width = img.width; let height = img.height; const MAX = 250;
        if(width>height){if(width>MAX){height*=MAX/width;width=MAX}}else{if(height>MAX){width*=MAX/height;height=MAX}}
        canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        const res = await apiCall("saveLogo", { base64: dataUrl }, "POST");
        if (res?.success) { setLogoB64(dataUrl); showToast("Logo diperbarui!"); } else showToast("Gagal", "bad");
      }; img.src = event.target.result;
    }; reader.readAsDataURL(file);
  };

  const handleSimpanKop = async () => {
    const res = await apiCall("saveKopSurat", kopSurat, "POST");
    if(res?.success) showToast("Kop Surat tersimpan!"); else showToast("Gagal", "bad");
  };

  const handleUploadGaleri = (e) => {
    if(!judulGaleri) return showToast("Isi judul gambar dulu!", "bad");
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        let width = img.width; let height = img.height; const MAX = 600;
        if(width>height){if(width>MAX){height*=MAX/width;width=MAX}}else{if(height>MAX){width*=MAX/height;height=MAX}}
        canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        
        const res = await apiCall("addGaleri", { judul: judulGaleri, base64: dataUrl }, "POST");
        if (res?.success) { showToast("Foto diunggah ke Galeri!"); setJudulGaleri(""); onRefresh(); } else showToast("Gagal mengunggah", "bad");
      }; img.src = event.target.result;
    }; reader.readAsDataURL(file);
  };

  const handleCetakPDF = (jenis) => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: [215, 330] });

      const drawHeader = (title) => {
        if (logoB64) doc.addImage(logoB64, 'JPEG', 14, 10, 22, 22); 
        doc.setFontSize(16); doc.setFont("helvetica", "bold"); doc.text(kopSurat.nama.toUpperCase(), 40, 15);
        doc.setFontSize(12); doc.setFont("helvetica", "normal"); doc.text(kopSurat.pemerintahan, 40, 21);
        doc.setFontSize(9); doc.setFont("helvetica", "italic"); doc.text(kopSurat.alamat, 40, 26);
        doc.setLineWidth(0.8); doc.line(14, 32, 201, 32);
        doc.setLineWidth(0.3); doc.line(14, 33, 201, 33);
        doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text(title, 14, 43);
        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        if(jenis !== 'anggota') doc.text(`Periode Laporan: ${bulanLabel(bulanLaporan)}`, 14, 49);
      };

      let head = []; let body = []; let startY = 55;

      if (jenis === 'anggota') {
        drawHeader("LAPORAN DATA BUKU INDUK ANGGOTA");
        head = [['No', 'ID', 'Nama Lengkap', 'NIK', 'No HP', 'Luas (Ha)', 'Status']];
        body = anggota.map((a, i) => [i + 1, a.ID, a.Nama, a.NIK, a.NoHP || '-', a.LuasLahan_Ha, a.Status]);
        doc.autoTable({ startY, head, body, theme: 'grid', styles: { fontSize: 9 } });
      } else if (jenis === 'iuran_pengeluaran') {
        drawHeader("LAPORAN ARUS KAS KELOMPOK TANI");
        const inF = iuran.filter(i => i.Bulan === bulanLaporan);
        const outF = pengeluaran.filter(p => String(p.Tanggal).startsWith(bulanLaporan));
        let totalIn = 0; let totalOut = 0;
        
        doc.setFont("helvetica", "bold"); doc.text("A. PEMASUKAN IURAN WAJIB", 14, startY);
        head = [['No', 'Nama Anggota', 'Status Bayar', 'Nominal']];
        body = inF.map((r, i) => { if (r.StatusBayar === 'Lunas') totalIn += Number(r.Nominal || 0); return [i + 1, r.NamaAnggota, r.StatusBayar, formatRupiah(r.Nominal)]; });
        doc.autoTable({ startY: startY+3, head, body, theme: 'grid', styles: { fontSize: 9 } });
        
        let nextY = doc.lastAutoTable.finalY + 10;
        doc.setFont("helvetica", "bold"); doc.text("B. PENGELUARAN OPERASIONAL", 14, nextY);
        head = [['No', 'Tanggal', 'Keterangan', 'Kategori', 'Nominal']];
        body = outF.map((r, i) => { totalOut += Number(r.Nominal || 0); return [i + 1, formatTanggal(r.Tanggal), r.Keterangan, r.Kategori, formatRupiah(r.Nominal)]; });
        doc.autoTable({ startY: nextY+3, head, body, theme: 'grid', styles: { fontSize: 9 } });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(11);
        doc.text(`Total Pemasukan Kas  : Rp ${totalIn.toLocaleString('id-ID')}`, 14, finalY);
        doc.text(`Total Pengeluaran Kas: Rp ${totalOut.toLocaleString('id-ID')}`, 14, finalY + 6); 
        doc.text(`Saldo Kas Periode Ini: Rp ${(totalIn - totalOut).toLocaleString('id-ID')}`, 14, finalY + 12);
      }
      doc.save(`Laporan_${jenis}_${bulanLaporan}.pdf`);
      showToast(`Laporan PDF berhasil dibuat!`);
    } catch (err) { showToast("Gagal membuat PDF.", "bad"); }
  };

  return (
    <div className="animate-slideDown space-y-6">
      <SectionHeader eyebrow="Konfigurasi" title="Pengaturan & Laporan" desc="Pusat kontrol identitas, unggah media, dan unduh dokumen resmi PDF." />
      
      <div className="flex gap-2 p-1.5 bg-white border border-slate-200 rounded-2xl w-full max-w-2xl shadow-sm overflow-x-auto hide-scroll">
         <button onClick={() => setActiveSub('kop')} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${activeSub === 'kop' ? 'bg-brand-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>Profil & Kop Surat</button>
         <button onClick={() => setActiveSub('galeri')} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${activeSub === 'galeri' ? 'bg-brand-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>Unggah Galeri</button>
         <button onClick={() => setActiveSub('cetak')} className={`px-5 py-3 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${activeSub === 'cetak' ? 'bg-brand-900 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>Cetak Laporan PDF</button>
      </div>

      {activeSub === 'kop' && (
        <div className="grid md:grid-cols-2 gap-8 animate-slideDown">
           <div className="p-8 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl relative overflow-hidden">
             <h3 className="font-serif font-black text-xl mb-6 border-b pb-4">Logo Resmi</h3>
             <div className="flex flex-col items-center text-center">
               <div className="w-40 h-40 rounded-full overflow-hidden border-4 border-surface shadow-md bg-brand-900 flex items-center justify-center relative mb-6">
                 {logoB64 ? <img src={logoB64} className="absolute inset-0 w-full h-full object-cover scale-[1.25]" /> : <span className="font-serif font-black text-brand-300 text-4xl">KT</span>}
               </div>
               <p className="text-xs text-slate-500 mb-4 font-medium leading-relaxed">Gunakan gambar rasio 1:1. Logo ini akan dicetak pada pojok kiri Kop Surat Laporan PDF.</p>
               <input type="file" accept="image/*" ref={fileInputRef} onChange={handleUploadLogo} className="hidden" />
               <button onClick={() => fileInputRef.current.click()} className="px-6 py-3 rounded-xl text-sm font-bold bg-brand-900 text-white shadow-lg w-full">Ganti Logo Instansi</button>
             </div>
           </div>
           <div className="p-8 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl relative overflow-hidden">
             <h3 className="font-serif font-black text-xl mb-6 border-b pb-4">Desain Kop Surat PDF</h3>
             <div className="space-y-4 mb-6">
                <div><label className="block text-xs font-bold mb-1">Nama Organisasi Utama (Font Besar)</label><input value={kopSurat.nama} onChange={e=>setKopSurat({...kopSurat, nama: e.target.value})} className="w-full p-3.5 rounded-xl border bg-surface font-bold text-slate-900" /></div>
                <div><label className="block text-xs font-bold mb-1">Nama Pemerintahan / Afiliasi (Font Sedang)</label><input value={kopSurat.pemerintahan} onChange={e=>setKopSurat({...kopSurat, pemerintahan: e.target.value})} className="w-full p-3.5 rounded-xl border bg-surface text-sm" /></div>
                <div><label className="block text-xs font-bold mb-1">Baris Alamat Lengkap (Font Kecil Italic)</label><textarea rows="2" value={kopSurat.alamat} onChange={e=>setKopSurat({...kopSurat, alamat: e.target.value})} className="w-full p-3.5 rounded-xl border bg-surface text-sm resize-none"></textarea></div>
             </div>
             <button onClick={handleSimpanKop} className="px-6 py-3 rounded-xl text-sm font-bold bg-brand-900 text-white shadow-lg w-full">Simpan Format Kop Surat</button>
           </div>
        </div>
      )}

      {activeSub === 'galeri' && (
        <div className="p-8 md:p-10 rounded-[2.5rem] bg-white border border-slate-200 shadow-xl max-w-2xl animate-slideDown">
          <h3 className="font-serif font-black text-xl mb-6 border-b pb-4">Unggah Media Baru ke Galeri</h3>
          <div className="space-y-6">
            <div>
              <label className="block text-xs font-bold mb-2">Beri Judul Foto Kegiatan</label>
              <input placeholder="Contoh: Panen Raya Jagung..." value={judulGaleri} onChange={(e) => setJudulGaleri(e.target.value)} className="w-full px-5 py-4 rounded-xl border border-slate-200 text-sm font-bold bg-surface focus:ring-2 focus:ring-brand-500 outline-none" />
            </div>
            <div className="bg-brand-50 border-2 border-dashed border-brand-300 rounded-2xl p-8 text-center flex flex-col items-center justify-center">
              <svg className="w-10 h-10 text-brand-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <p className="text-sm font-bold text-brand-900 mb-4">Pilih dan kompres otomatis untuk Galeri</p>
              <input type="file" accept="image/*" ref={fileGaleriRef} onChange={handleUploadGaleri} className="hidden" />
              <button onClick={() => { if(!judulGaleri) { showToast("Tulis judul dulu sebelum pilih gambar!", "warn"); return;} fileGaleriRef.current.click(); }} className="px-6 py-3 rounded-xl text-sm font-bold bg-white border border-brand-200 text-brand-700 shadow-sm hover:bg-brand-100 transition-colors">Pilih File Media</button>
            </div>
          </div>
        </div>
      )}

      {activeSub === 'cetak' && (
        <div className="p-8 md:p-10 rounded-[2.5rem] bg-white border border-brand-200 shadow-xl max-w-4xl animate-slideDown">
          <h3 className="font-serif font-black text-2xl mb-2 text-slate-900">Pusat Cetak Laporan (PDF)</h3>
          <p className="text-sm text-slate-500 mb-8 border-b pb-5">Dokumen akan dicetak menggunakan Kop Surat yang telah Anda atur.</p>
          <div className="mb-8">
             <label className="block text-xs font-bold mb-2 text-slate-700 uppercase">Periode Laporan Laba/Rugi</label>
             <input type="month" value={bulanLaporan} onChange={(e) => setBulanLaporan(e.target.value)} className="w-full max-w-sm px-5 py-3.5 rounded-xl border border-slate-200 text-sm font-bold bg-surface focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div className="grid md:grid-cols-2 gap-5">
             <button onClick={() => handleCetakPDF('anggota')} className="text-left p-6 rounded-2xl border-[3px] border-slate-100 hover:border-brand-400 group transition-all">
               <div className="font-black text-lg text-slate-900 group-hover:text-brand-800">Buku Induk Anggota</div>
               <div className="text-xs text-slate-500 mt-2">Cetak direktori lengkap kepemilikan lahan (Semua Periode).</div>
             </button>
             <button onClick={() => handleCetakPDF('iuran_pengeluaran')} className="text-left p-6 rounded-2xl border-[3px] border-slate-100 hover:border-brand-400 group transition-all">
               <div className="font-black text-lg text-slate-900 group-hover:text-brand-800">Laporan Arus Kas</div>
               <div className="text-xs text-slate-500 mt-2">Cetak kas masuk (iuran) dan pengeluaran pada periode {bulanLabel(bulanLaporan)}.</div>
             </button>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
